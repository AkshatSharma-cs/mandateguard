# docs/openapi.yaml
openapi: 3.1.0
info:
  title: MandateGuard API
  version: 5.0.0
  description: >-
    MandateGuard is an authorization gateway. A demo-store listing may use PayPal Sandbox;
    other listings are evaluated and handed off without creating proposals or orders.
servers:
  - url: http://localhost:3000/v1
paths:
  /profiles:
    get:
      summary: List profiles for the local owner
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/Profile' }
    post:
      summary: Create a pending profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [limits]
                  properties:
                    limits: { $ref: '#/components/schemas/ProfileLimits' }
                - type: object
                  additionalProperties: false
                  required: [instruction]
                  properties:
                    instruction: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '201':
          description: Profile awaiting explicit confirmation
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /profiles/{id}/confirm:
    post:
      summary: Confirm a pending profile
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: User-confirmed active profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /profiles/{id}/default:
    post:
      summary: Set the confirmed profile as the owner's default
      description: Replaces any previous default atomically.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Default profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /mandates:
    post:
      summary: Create a task mandate
      description: Uses profile_id or the active default. An in-profile task auto-activates; an expansion remains pending and lists exceeded limits in notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instruction: { type: string, maxLength: 10000, default: '' }
                profile_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201':
          description: Derived task mandate
          content:
            application/json:
              schema:
                type: object
                required: [mandate, notes, within_profile, exceeded]
                properties:
                  mandate: { $ref: '#/components/schemas/Mandate' }
                  notes: { type: array, items: { type: string } }
                  within_profile: { type: [boolean, 'null'] }
                  exceeded: { type: array, items: { type: string } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /evaluate:
    post:
      summary: Evaluate an observation against a mandate or default profile
      description: Alternatives default to true and are bounded to 12 seconds. Omit both ids to use the active default profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [observation]
              properties:
                mandate_id: { type: string }
                profile_id: { type: string }
                alternatives: { type: boolean, default: true }
                observation: { $ref: '#/components/schemas/ProductObservationInput' }
      responses:
        '200':
          description: Decision and up to three allowed alternatives
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluateResult' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: No preferences or other evaluation conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /evaluations/{id}/handoff:
    post:
      summary: Audit and return the URL for an external listing
      description: Appends HANDOFF_OPENED only. Does not create a proposal or PayPal order.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: External listing URL
          content:
            application/json:
              schema:
                type: object
                required: [handoff_url]
                properties:
                  handoff_url: { type: string, format: uri }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /proposals:
    post:
      summary: Create a proposal from a saved ALLOW evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evaluation_id]
              properties:
                evaluation_id: { type: string }
      responses:
        '201':
          description: Protected proposal and console link
          content:
            application/json:
              schema:
                type: object
                required: [proposal, console_url]
                properties:
                  proposal: { $ref: '#/components/schemas/Proposal' }
                  console_url: { type: string, format: uri }
        '409':
          description: Evaluation is stale, unpriced, currency-mismatched, or the mandate is inactive
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ErrorResponse' }
  /proposals/{id}/checkout:
    post:
      summary: Create a PayPal Sandbox order or disclosed external purchase simulation
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: PayPal order id
          content:
            application/json:
              schema:
                type: object
                required: [paypal_order_id]
                properties:
                  paypal_order_id: { type: string }
        '409':
          description: Proposal is stale, invalid, or not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /proposals/{id}/capture:
    post:
      summary: Verify and capture a buyer-approved PayPal Sandbox order
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_id]
              properties:
                order_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Capture result and verification checks
          content:
            application/json:
              schema:
                type: object
                required: [status, checks, capture]
                properties:
                  status: { type: string }
                  checks: { type: array, items: { type: object } }
                  capture: { type: [object, 'null'] }
        '409':
          description: Verification refused capture
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ErrorResponse' }
  /proposals/{id}/receipt:
    get:
      summary: Get a captured PayPal Sandbox receipt
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Captured receipt with V1–V12 checks and audit status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /search:
    post:
      summary: Search for allowed alternatives using the default profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 300 }
                observation: { $ref: '#/components/schemas/ProductObservationInput' }
      responses:
        '200':
          description: Up to three allowed alternatives
          content:
            application/json:
              schema:
                type: object
                required: [alternatives]
                properties:
                  alternatives:
                    type: array
                    maxItems: 3
                    items: { $ref: '#/components/schemas/Alternative' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ProfileLimits:
      type: object
      additionalProperties: false
      required: [max_total, allow_bundles, allow_addons, require_first_party, allowed_domains]
      properties:
        max_total: { type: string, pattern: '^\d+\.\d{2}$', description: USD amount up to 1000.00 }
        allow_bundles: { type: boolean }
        allow_addons: { type: boolean }
        require_first_party: { type: boolean }
        allowed_domains:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: hostname }
    Mandate:
      type: object
      required: [mandate_id, kind, parent_profile_id, is_default, confirmed_by, item_query, category_terms, version, status, max_total_cents, allow_bundles, allow_addons, require_first_party, allowed_domains]
      properties:
        mandate_id: { type: string }
        kind: { type: string, enum: [task, profile] }
        parent_profile_id: { type: [string, 'null'] }
        is_default: { type: boolean }
        confirmed_by: { type: [string, 'null'] }
        item_query: { type: [string, 'null'] }
        category_terms: { type: array, items: { type: string } }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending_confirmation, active, revoked] }
        max_total_cents: { type: integer, minimum: 0, maximum: 100000 }
        allow_bundles: { type: boolean }
        allow_addons: { type: boolean }
        require_first_party: { type: boolean }
        allowed_domains: { type: array, items: { type: string } }
    Profile:
      allOf:
        - { $ref: '#/components/schemas/Mandate' }
        - type: object
          properties:
            kind: { const: profile }
            item_query: { type: 'null' }
    ProductObservationInput:
      type: object
      additionalProperties: false
      required: [observation_id, url, domain, source, title, price_cents, currency, seller, sold_by_merchant, availability, image_url, category_hint, bundle_signal, hidden_text_found, text, captured_at, content_hash]
      properties:
        observation_id: { type: string }
        checkout_mode: { type: string, enum: [gateway, handoff], description: Ignored; checkout mode is server-derived. }
        handoff_url: { type: string, format: uri, description: Ignored; handoff URL is server-derived. }
        url: { type: string, format: uri }
        domain: { type: string }
        source: { type: string, enum: [curated, channel3, page] }
        title: { type: string }
        price_cents: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        seller: { type: string }
        sold_by_merchant: { type: boolean }
        availability: { type: string }
        image_url: { type: [string, 'null'], format: uri }
        category_hint: { type: [string, 'null'] }
        bundle_signal: { type: [boolean, 'null'] }
        hidden_text_found: { type: boolean }
        text: { type: string, maxLength: 4000 }
        captured_at: { type: string, format: date-time }
        content_hash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    Observation:
      allOf:
        - { $ref: '#/components/schemas/ProductObservationInput' }
        - type: object
          required: [checkout_mode]
          properties:
            checkout_mode: { type: string, enum: [gateway, handoff] }
            handoff_url: { type: [string, 'null'], format: uri }
    Alternative:
      type: object
      required: [evaluation_id, observation, decision, reasons, checkout_mode]
      properties:
        evaluation_id: { type: string }
        observation: { $ref: '#/components/schemas/Observation' }
        decision: { const: ALLOW }
        reasons: { type: array, maxItems: 0 }
        checkout_mode: { type: string, enum: [gateway, handoff] }
        payment_mode: { type: string, enum: [store_checkout, sandbox_simulation] }
        simulated: { type: boolean }
        disclosure: { type: string }
        handoff_url: { type: string, format: uri }
    EvaluateResult:
      type: object
      required: [evaluation_id, decision, reasons, checks, observation, expires_at, alternatives, checkout_mode]
      properties:
        evaluation_id: { type: string }
        decision: { type: string, enum: [ALLOW, REVIEW, BLOCK] }
        reasons: { type: array, items: { type: object } }
        checks: { type: array, items: { type: object } }
        observation: { $ref: '#/components/schemas/Observation' }
        checkout_mode: { type: string, enum: [gateway, handoff] }
        payment_mode: { type: string, enum: [store_checkout, sandbox_simulation] }
        simulated: { type: boolean }
        disclosure: { type: string }
        handoff_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        alternatives:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Alternative' }
    CandidateFlags:
      type: object
      additionalProperties: false
      required: [injection, hidden_text, urgency, price_conflict]
      properties:
        injection: { type: boolean, description: Listing text contains agent-directed instructions or an authority override. }
        hidden_text: { type: boolean, description: Hidden or invisible listing text was detected. }
        urgency: { type: boolean, description: Listing text pressures immediate action. }
        price_conflict: { type: boolean, description: Claimed price differs from structured catalogue price. }
    AgentCandidate:
      type: object
      required: [product_id, decision, reasons, checks, extraction, observation, flags]
      properties:
        product_id: { type: string }
        decision: { type: string, enum: [ALLOW, REVIEW, BLOCK] }
        reasons: { type: array, items: { type: object } }
        checks: { type: array, items: { type: object } }
        extraction: { type: [object, 'null'] }
        observation: { $ref: '#/components/schemas/Observation' }
        flags: { $ref: '#/components/schemas/CandidateFlags' }
    Proposal:
      type: object
      properties:
        proposal_id: { type: string }
        mandate_id: { type: string }
        mandate_version: { type: integer }
        source: { type: string, enum: [protected, naive] }
        status: { type: string }
        checkout_mode: { type: string, enum: [gateway, handoff] }
        payment_mode: { type: string, enum: [store_checkout, sandbox_simulation] }
        simulated: { type: boolean }
        disclosure: { type: string }
        handoff_url: { type: string, format: uri }
        items: { type: array, items: { type: object } }
        total_cents: { type: integer }
    Receipt:
      type: object
      required: [proposal_id, status, simulated, disclosure, product, paypal, checks, audit, created_at, captured_at]
      properties:
        proposal_id: { type: string }
        status: { const: CAPTURED }
        simulated: { type: boolean }
        disclosure: { type: string }
        product: { type: object }
        paypal: { type: object }
        checks: { type: array, items: { type: object, required: [id, passed, detail] } }
        audit: { type: object, required: [chain_ok, events_count] }
        created_at: { type: string, format: date-time }
        captured_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    HandoffConflict:
      type: object
      required: [error, handoff_url]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { const: CHECKOUT_NOT_CONTROLLED }
            message: { type: string }
        handoff_url: { type: string, format: uri }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
