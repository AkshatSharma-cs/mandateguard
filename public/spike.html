<!-- public/spike.html -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>PayPal spike</title></head>
<body>
  <h1>PayPal spike</h1>
  <div id="buttons"></div>
  <pre id="out"></pre>
  <script>
    const out = document.getElementById('out');
    let currentProposalId = null;

    function show(obj) { out.textContent = JSON.stringify(obj, null, 2); }

    async function start() {
      const cfg = await (await fetch('/spike/config')).json();
      if (!cfg.client_id) { show({ error: 'PAYPAL_CLIENT_ID not set on server' }); return; }

      const s = document.createElement('script');
      s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(cfg.client_id) +
              '&currency=USD&intent=capture';
      s.onload = () => {
        paypal.Buttons({
          createOrder: async () => {
            const r = await fetch('/spike/create', { method: 'POST' });
            const j = await r.json();
            if (!r.ok) { show(j); throw new Error(j.error || 'create failed'); }
            currentProposalId = j.proposal_id;
            return j.id;
          },
          onApprove: async (data) => {
            const r = await fetch('/spike/capture', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ order_id: data.orderID, proposal_id: currentProposalId }),
            });
            show(await r.json());
          },
          onCancel: () => show({ cancelled: true }),
          onError: (err) => show({ sdk_error: String(err) }),
        }).render('#buttons');
      };
      s.onerror = () => show({ error: 'failed to load PayPal SDK' });
      document.head.appendChild(s);
    }
    start();
  </script>
</body>
</html>
